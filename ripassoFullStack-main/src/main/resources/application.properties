spring.application.name=Ripasso

# Railway provides these values through environment variables.
# In Railway, create DATABASE_URL using the Postgres private-network reference
# shown by Railway, or set the SPRING_DATASOURCE_* variables directly.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT. Railway should provide JWT_SECRET; the local fallback is only for development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
