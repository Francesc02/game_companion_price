spring.application.name=Ripasso

server.port=${PORT:8080}

# PostgreSQL
# Railway injects PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
# Locally, use the Railway CLI + tunnel to reuse Railway variables
# without committing credentials to Git.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT. Configure JWT_SECRET in Railway.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS. Comma-separated origins are supported.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://gamecompanionprice-production.up.railway.app,http://localhost:4200}
