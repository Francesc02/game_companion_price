spring.application.name=Ripasso

# Local default; Railway overrides these through environment variables.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT: set JWT_SECRET in Railway. The fallback exists only to allow local development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
