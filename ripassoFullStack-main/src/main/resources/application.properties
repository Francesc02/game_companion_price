spring.application.name=Ripasso

server.port=${PORT:8080}

# PostgreSQL. Railway can inject PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
# from the Postgres service over its private network.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT. Set JWT_SECRET in Railway/local environment.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
